# Coolify deployment — add as a "Docker Compose" resource pointing at this file.
# Traefik (managed by Coolify) terminates TLS and routes the domain to `web`;
# no host ports are published here. Set the env vars below in the Coolify UI.
services:
  api:
    build: ./server/YemeniBreeze.Api
    environment:
      - ConnectionStrings__Default=Data Source=/data/yemenibreeze.db
      - Jwt__Key=${JWT_KEY}
      - Admin__Email=${ADMIN_EMAIL}
      - Admin__Password=${ADMIN_PASSWORD}
      - Cors__Origins__0=${SITE_ORIGIN}
      # Email provider: "resend" or "smtp". Leave EMAIL_PROVIDER blank to use Resend
      # when RESEND_API_KEY is set, otherwise SMTP (Brevo by default).
      - Email__Provider=${EMAIL_PROVIDER}
      - Email__ResendApiKey=${RESEND_API_KEY}
      - Email__SmtpHost=${EMAIL_SMTP_HOST:-smtp-relay.brevo.com}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - Email__SmtpUser=${EMAIL_SMTP_USER}
      - Email__SmtpKey=${EMAIL_SMTP_KEY}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS}
      - Email__FromName=Yemen Breeze
      - Email__PublicBaseUrl=${SITE_ORIGIN}
      # Abuse protection on the public forms (register, contact, cancel): requests per IP per 10 minutes.
      - RateLimiting__PermitLimit=${RATE_LIMIT_PER_10_MIN:-10}
      # Proxies in front of the API (Traefik + the web container's nginx). Use 3 if Cloudflare
      # proxies the domain too, or every visitor shares Cloudflare's IP and hits the limit.
      - ForwardedHeaders__ForwardLimit=${PROXY_HOPS:-2}
      # Hetzner Object Storage (S3). Leave blank to fall back to the local uploads volume.
      - Storage__Endpoint=${STORAGE_ENDPOINT}
      - Storage__Region=${STORAGE_REGION}
      - Storage__Bucket=${STORAGE_BUCKET}
      - Storage__AccessKey=${STORAGE_ACCESS_KEY}
      - Storage__SecretKey=${STORAGE_SECRET_KEY}
    volumes:
      - dbdata:/data
      - uploads:/app/wwwroot/uploads
    restart: unless-stopped

  web:
    build: ./client
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
