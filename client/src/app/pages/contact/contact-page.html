<section class="section-dark page-head page-hero">
  <div class="container">
    <h1>{{ 'contact.title' | transloco }}</h1>
    <p class="contact-intro">{{ 'contact.bookingIntro' | cms }}</p>
  </div>
</section>

<section class="section">
  <div class="container contact-grid">
    <div class="contact-side">
      <h2 class="side-title" appReveal>{{ 'services.title' | cms }}</h2>
      @for (service of services; track service) {
        <app-service-card [service]="service" appReveal />
      }
      <div class="card card-content side-card" appReveal>
        <span class="icon-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4.2" />
            <circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <h3>Instagram</h3>
        <p>
          <a href="https://instagram.com/Yemeni.breeze" target="_blank" rel="noopener" dir="ltr">&#64;Yemeni.breeze</a>
        </p>
      </div>
    </div>

    <div class="card card-form contact-form" appReveal>
      @if (!sent()) {
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="field">
            <label for="name">{{ 'contact.name' | transloco }}</label>
            <input id="name" formControlName="name" autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">{{ 'contact.email' | transloco }}</label>
            <input id="email" formControlName="email" type="email" autocomplete="email" />
          </div>
          <div class="field">
            <label for="subject">{{ 'contact.subject' | transloco }}</label>
            <input id="subject" formControlName="subject" />
          </div>
          <div class="field">
            <label for="message">{{ 'contact.message' | transloco }}</label>
            <textarea id="message" formControlName="message" rows="6"></textarea>
          </div>
          @if (failed()) {
            <p class="error-text">{{ 'contact.error' | transloco }}</p>
          }
          <button class="btn btn-primary btn-arrow" type="submit" [disabled]="sending()">
            {{ (sending() ? 'contact.sending' : 'contact.send') | transloco }}
          </button>
        </form>
      } @else {
        <div class="sent-result" animate.enter="yb-rise-in">
          <span class="sent-icon">💌</span>
          <p>{{ 'contact.sent' | transloco }}</p>
        </div>
      }
    </div>
  </div>
</section>
